<!doctype html>
<html>
	<head>
		<title>GitHub Hidden Threads</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0d1117;
				--panel-hover: #21262d;
				--border: #30363d;
				--text: #c9d1d9;
				--muted: #959ea7;
				--primary: #238636;
				--primary-light: #2ea44f;
				--primary-text: #ffffff;
				--danger: #ff6b6b;
				--warning: #f4bd50;
				--success: var(--primary-light);
			}

			* {
				box-sizing: border-box;
			}

			body {
				width: 405px;
				margin: 0;
				padding: 24px;
				overflow: hidden;
				background: var(--bg);
				color: var(--text);
				font-size: 14px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			.popup {
				animation: fadeIn 140ms ease-out;
			}

			.header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 18px;
			}

			h1 {
				margin: 0;
				font-size: 16px;
				font-weight: 600;
			}

			.logo {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.pill {
				padding: 4px 8px;
				border: 1px solid var(--border);
				border-radius: 999px;
				color: var(--muted);
				background: var(--panel-hover);
				font-size: 12px;
				line-height: 1;
				white-space: nowrap;
			}

			.status {
				position: relative;
				min-height: 54px;
				padding: 9px 4px 9px 22px;
				margin-left: 7px;
				border-left: 2px solid var(--border);
				color: var(--text);
				font-size: 14px;
				line-height: 1.5;
				display: flex;
				align-items: center;
				transition:
					border-color 160ms ease,
					color 160ms ease,
					transform 160ms ease,
					opacity 160ms ease;
			}

			.status::before {
				position: absolute;
				top: calc(50% - 10px);
				left: -10px;
				width: 11px;
				height: 11px;
				border: 4px solid var(--bg);
				border-radius: 50%;
				background: var(--muted);
				content: "";
				transition: background 160ms ease;
			}

			.status.updating {
				opacity: 0.72;
				transform: translateY(1px);
			}

			.status.success {
				color: var(--success);
				border-color: rgba(46, 191, 107, 0.5);
			}

			.status.success::before {
				background: var(--success);
			}

			.status.warning {
				color: var(--warning);
				border-color: rgba(244, 189, 80, 0.5);
			}

			.status.warning::before {
				background: var(--warning);
			}

			.status.error {
				color: var(--danger);
				border-color: rgba(255, 107, 107, 0.5);
			}

			.status.error::before {
				background: var(--danger);
			}

			button {
				width: 100%;
				margin-top: 16px;
				border: 1px solid rgba(7, 26, 16, 0.18);
				border-radius: 8px;
				padding: 10px 14px;
				color: var(--primary-text);
				background: var(--primary);
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition:
					background 140ms ease,
					opacity 140ms ease,
					transform 140ms ease;
			}

			button:hover:not(:disabled) {
				background: var(--primary-light);
			}

			button:active:not(:disabled) {
				transform: translateY(1px);
			}

			button:disabled {
				opacity: 0.7;
				cursor: not-allowed;
			}

			.loader {
				display: none;
				width: 12px;
				height: 12px;
				margin-right: 6px;
				border: 2px solid rgba(7, 26, 16, 0.3);
				border-top-color: var(--primary-text);
				border-radius: 50%;
				vertical-align: -2px;
				animation: spin 700ms linear infinite;
			}

			button.loading .loader {
				display: inline-block;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(2px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>

	<body>
		<div class="popup">
			<div class="header">
				<div class="logo">
					<img src="icons/icon_16x16.png" alt="Logo">
					<h1>GitHub Thread Expander</h1>
				</div>
				<span id="pagePill" class="pill">Checking</span>
			</div>

			<div id="status" class="status">Ready to expand hidden threads on this page.</div>

			<button id="actionButton" disabled>
				<span class="loader"></span>
				<span id="buttonText">Checking...</span>
			</button>
		</div>

		<script src="popup.js"></script>
	</body>
</html>
